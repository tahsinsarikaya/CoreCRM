services:
  postgres:
    image: postgres:16
    container_name: corecrm-postgres
    environment:
      POSTGRES_USER: corecrm
      POSTGRES_PASSWORD: corecrm
      POSTGRES_DB: corecrm
    ports:
      - "5433:5432"
    volumes:
      - corecrm-postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: corecrm-redis
    ports:
      - "6379:6379"
volumes:
  corecrm-postgres-data: